<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>보거스 1기 CREW — 활동 현황</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Black+Han+Sans&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px}
body{background:#0a0f1e;color:#f1f5f9;font-family:'Noto Sans KR',sans-serif;min-height:100vh}
.wrap{max-width:680px;margin:0 auto;padding:28px 16px 48px}

/* 상단 */
.top{display:flex;align-items:center;gap:16px;margin-bottom:28px}
.back-btn{
  display:flex;align-items:center;gap:6px;color:#64748b;text-decoration:none;
  font-size:13px;background:rgba(100,116,139,.1);border:1px solid #334155;
  padding:7px 14px;border-radius:8px;transition:all .2s
}
.back-btn:hover{color:#f1f5f9;background:rgba(100,116,139,.2)}
.page-title{flex:1;text-align:center}
.page-title h1{font-family:'Black Han Sans',sans-serif;font-size:22px;color:#deff9a}
.page-title p{font-size:11px;color:#64748b;margin-top:2px}

/* 요약 카드 3개 */
.summary{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap}
.sum-card{
  flex:1;min-width:120px;background:rgba(30,41,59,.8);border:1px solid #334155;
  border-radius:12px;padding:14px 16px;text-align:center
}
.sum-card .lbl{font-size:10px;color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.sum-card .val{font-size:22px;font-weight:700;margin-top:4px}
.val-green{color:#4ade80}
.val-blue{color:#60a5fa}
.val-yellow{color:#deff9a}

/* 크루 목록 */
.crew-list{display:flex;flex-direction:column;gap:8px}
.crew-card{
  background:rgba(30,41,59,.7);border:1px solid #334155;border-radius:12px;
  padding:14px 16px;display:flex;align-items:center;gap:12px;
  transition:border-color .2s
}
.crew-card:hover{border-color:#475569}

.rank{
  font-family:monospace;font-size:13px;color:#475569;
  width:28px;text-align:center;flex-shrink:0
}
.rank-gold{font-size:18px}
.rank-silver{font-size:18px}
.rank-bronze{font-size:18px}

.crew-avatar{
  width:40px;height:40px;border-radius:50%;
  background:linear-gradient(135deg,#1e293b,#334155);
  border:2px solid #334155;display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;color:#deff9a;flex-shrink:0
}

.crew-info{flex:1;min-width:0}
.crew-name{font-size:15px;font-weight:700;color:#f1f5f9}
.crew-meta{font-size:11px;color:#64748b;margin-top:2px}

.crew-stats{display:flex;gap:12px;align-items:center;flex-shrink:0}
.stat-item{text-align:center}
.stat-item .s-val{font-size:18px;font-weight:700}
.stat-item .s-lbl{font-size:9px;color:#64748b;font-weight:600;text-transform:uppercase}
.completed-val{color:#4ade80}

/* 완료 바 */
.progress-wrap{margin-top:6px}
.progress-bar{
  height:3px;background:#1e293b;border-radius:99px;overflow:hidden;margin-top:4px
}
.progress-fill{height:100%;background:#4ade80;border-radius:99px;transition:width .5s ease}

/* 로딩 */
.loading{text-align:center;padding:48px;color:#475569;font-size:14px}
.empty{text-align:center;padding:48px;color:#475569}

.updated{text-align:center;color:#475569;font-size:11px;margin-top:16px}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <a href="index.html" class="back-btn">← 메인</a>
    <div class="page-title">
      <h1>보거스 1기 CREW</h1>
      <p>활동 현황 대시보드</p>
    </div>
    <div style="width:72px"></div>
  </div>

  <!-- 요약 -->
  <div class="summary">
    <div class="sum-card">
      <p class="lbl">크루 인원</p>
      <p class="val val-yellow" id="crewCount">—</p>
    </div>
    <div class="sum-card">
      <p class="lbl">총 완료</p>
      <p class="val val-green" id="totalCompleted">—</p>
    </div>
    <div class="sum-card">
      <p class="lbl">총 요청</p>
      <p class="val val-blue" id="totalRequested">—</p>
    </div>
  </div>

  <!-- 크루 목록 -->
  <div class="crew-list" id="crewList">
    <div class="loading">⏳ 불러오는 중...</div>
  </div>

  <p class="updated" id="updated"></p>
</div>

<script>
const SUPABASE_URL = 'https://ewuimpdposvcoaeqkcrc.supabase.co'
const SUPABASE_KEY = 'sb_publishable_gzZnqWvL_61ZTo9Gs5cajA_-zQeVnoi'
const { createClient } = supabase
const db = createClient(SUPABASE_URL, SUPABASE_KEY)

const MEDALS = ['🥇','🥈','🥉']

async function loadDashboard() {
  const { data, error } = await db
    .from('crew_dashboard')
    .select('*')

  const list = document.getElementById('crewList')

  if (error || !data) {
    list.innerHTML = '<div class="empty">데이터를 불러올 수 없어요.<br/><small>' + (error?.message||'') + '</small></div>'
    return
  }

  if (data.length === 0) {
    list.innerHTML = '<div class="empty">아직 가입한 크루원이 없어요.</div>'
    return
  }

  // 요약
  const totalCompleted  = data.reduce((s,r) => s + (r.completed||0), 0)
  const totalRequested  = data.reduce((s,r) => s + (r.total_requested||0), 0)
  const maxCompleted    = Math.max(...data.map(r => r.completed||0), 1)

  document.getElementById('crewCount').textContent      = data.length + '명'
  document.getElementById('totalCompleted').textContent = totalCompleted + '건'
  document.getElementById('totalRequested').textContent = totalRequested + '건'

  // 정렬 (완료 내림차순)
  const sorted = [...data].sort((a,b) => (b.completed||0) - (a.completed||0))

  list.innerHTML = ''
  sorted.forEach((crew, i) => {
    const card = document.createElement('div')
    card.className = 'crew-card'

    const rank = i < 3 ? `<span class="rank rank-${['gold','silver','bronze'][i]}">${MEDALS[i]}</span>`
                       : `<span class="rank">${i+1}</span>`

    const initial = crew.crew_name?.charAt(0) || '?'
    const completed = crew.completed || 0
    const requested = crew.total_requested || 0
    const received  = crew.total_received  || 0
    const pct = Math.round((completed / maxCompleted) * 100)

    card.innerHTML = `
      ${rank}
      <div class="crew-avatar">${initial}</div>
      <div class="crew-info">
        <p class="crew-name">${crew.crew_name || '—'}</p>
        <p class="crew-meta">요청함 ${requested}건 · 요청받음 ${received}건</p>
        <div class="progress-wrap">
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        </div>
      </div>
      <div class="crew-stats">
        <div class="stat-item">
          <div class="s-val completed-val">${completed}</div>
          <div class="s-lbl">완료</div>
        </div>
      </div>
    `
    list.appendChild(card)
  })

  const now = new Date()
  document.getElementById('updated').textContent =
    '최근 업데이트: ' + now.toLocaleString('ko-KR', {hour:'2-digit',minute:'2-digit'})
}

loadDashboard()
// 1분마다 자동 갱신
setInterval(loadDashboard, 60000)
</script>
</body>
</html>
