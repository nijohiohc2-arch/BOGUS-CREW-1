<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>내 관리 페이지 — 보거스 CREW</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:12px}
body{background:#0f172a;color:#f1f5f9;font-family:'Noto Sans KR',sans-serif;min-height:100vh}
::-webkit-scrollbar{height:3px;width:3px}
::-webkit-scrollbar-track{background:#1e293b}
::-webkit-scrollbar-thumb{background:#334155;border-radius:2px}

#loadingScreen{position:fixed;inset:0;background:#0f172a;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.spinner{width:40px;height:40px;border:3px solid #1e293b;border-top-color:#deff9a;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loadingScreen p{color:#64748b;font-size:14px}

.wrap{max-width:1160px;margin:0 auto;padding:14px 12px}

nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;border-bottom:1px solid #1e293b;padding-bottom:12px;flex-wrap:wrap;gap:8px}
.nav-left h1{font-size:16px;font-weight:700;color:#deff9a}
.nav-left p{font-size:10px;color:#64748b;margin-top:1px}
.nav-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nav-btn{display:flex;align-items:center;gap:5px;background:rgba(30,41,59,.8);border:1px solid #334155;color:#94a3b8;padding:6px 12px;border-radius:7px;font-size:11px;cursor:pointer;text-decoration:none;font-family:inherit;transition:all .2s}
.nav-btn:hover{background:#1e293b;color:#f1f5f9}
.nav-btn.logout{color:#f87171;border-color:rgba(248,113,113,.3)}
.nav-btn.logout:hover{background:rgba(248,113,113,.1)}

.summary-row{display:flex;flex-wrap:wrap;justify-content:flex-end;margin-bottom:14px;gap:14px}
.stat-box{text-align:right}
.stat-box .lbl{font-size:9px;color:#475569;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.stat-box .val{font-size:16px;font-weight:700;color:#deff9a}
.saving{font-size:9px;color:#64748b;height:11px;text-align:right}

.stats-wrap{margin-bottom:14px}
.sec-title{font-size:11px;font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:8px}
.accent-bar{width:3px;height:14px;background:#deff9a;border-radius:9999px;display:inline-block}
.cards{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px}
.card{background:#1e293b;border:1px solid #334155;padding:7px 11px;border-radius:8px;min-width:90px;flex-shrink:0}
.card-date{font-size:9px;color:#64748b}
.card-count{font-size:14px;font-weight:700;color:#deff9a;margin-top:2px}
.card-unit{font-size:9px;color:#94a3b8;font-weight:400;margin-left:2px}
.empty-stat{color:#475569;font-style:italic;font-size:10px}

.tbl-wrap{background:rgba(30,41,59,.5);border:1px solid #334155;border-radius:10px;overflow:hidden}
.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead tr{background:rgba(15,23,42,.9)}
th{
  padding:7px 9px;text-align:left;border-bottom:1px solid #334155;
  font-size:10px;color:#e2e8f0;font-weight:700;  /* ← 흰색으로 변경 */
  white-space:nowrap;letter-spacing:.02em
}
tbody tr{border-bottom:1px solid rgba(51,65,85,.35);transition:background .2s}
tbody tr:last-child{border-bottom:none}
td{padding:5px 9px;vertical-align:middle}
tbody tr.over{background:rgba(251,191,36,.07)}
tbody tr.under{background:rgba(248,113,113,.07)}

.n{color:#475569;font-family:monospace;font-size:10px}

.counter-cell{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:60px}
.counter-row{display:flex;align-items:center;gap:4px}
.cnt-btn{width:18px;height:18px;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#94a3b8;font-size:13px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;font-family:inherit;transition:background .1s}
.cnt-btn:hover{background:#334155;color:#f1f5f9}
.cnt-num{min-width:22px;text-align:center;font-size:13px;font-weight:700;font-family:monospace}
.cnt-num.req{color:#60a5fa}
.cnt-num.rec{color:#4ade80}

.badge{font-size:9px;font-weight:700;padding:1px 5px;border-radius:99px;white-space:nowrap;line-height:1.4}
.badge-over{background:rgba(251,191,36,.18);color:#fbbf24;border:1px solid rgba(251,191,36,.3)}
.badge-under{background:rgba(248,113,113,.18);color:#f87171;border:1px solid rgba(248,113,113,.3)}
.badge-even{background:rgba(74,222,128,.15);color:#4ade80;border:1px solid rgba(74,222,128,.25)}

.name-cell{display:flex;align-items:center;gap:5px}
.inp-name{background:transparent;border:none;color:#e2e8f0;font-size:11px;width:68px;font-family:inherit}
.inp-name:focus{outline:2px solid #deff9a;outline-offset:1px;border-radius:3px}

.kakao-btn{width:20px;height:20px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;transition:transform .15s,opacity .15s;padding:0;line-height:1}
.kakao-btn:hover{transform:scale(1.2)}
.kakao-empty{background:#1e293b;color:#475569}.kakao-empty:hover{background:#334155;color:#94a3b8}
.kakao-linked{background:#FEE500;color:#3A1D1D}.kakao-linked:hover{opacity:.85}

.sel-status{background:#0f172a;border-radius:5px;padding:2px 5px;font-size:10px;cursor:pointer;font-family:inherit}
.sel-status:focus{outline:2px solid #deff9a;outline-offset:1px}
.wait{border:1px solid #334155;color:#94a3b8}
.done{border:1px solid #365314;color:#a3e635}

.inp-date,.inp-url,.inp-num{background:#0f172a;border:1px solid #334155;border-radius:5px;padding:2px 6px;font-size:10px;color:#94a3b8;font-family:inherit}
.inp-date:focus,.inp-url:focus,.inp-num:focus{outline:2px solid #deff9a;outline-offset:1px}
.inp-url{width:100%;color:#60a5fa}
.inp-num{width:72px;text-align:right;color:#deff9a;font-weight:700}

.photo-cell{display:flex;align-items:center;gap:6px}
.thumb{width:24px;height:24px;border-radius:5px;object-fit:cover;border:1.5px solid #4ade80;flex-shrink:0;display:block}
.no-thumb{width:24px;height:24px;border-radius:5px;border:1px dashed #475569;display:flex;align-items:center;justify-content:center;font-size:7px;color:#475569;flex-shrink:0}
.file-label{display:inline-block;background:#334155;color:#cbd5e1;border:1px solid #475569;padding:2px 7px;border-radius:4px;cursor:pointer;font-size:9px;font-weight:500;white-space:nowrap;font-family:inherit}
.file-label:hover{background:#475569}
.file-input{display:none}

.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:999;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:22px 24px;width:340px;max-width:90vw}
.modal-header{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.modal-icon{width:32px;height:32px;border-radius:50%;background:#FEE500;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.modal-title{font-size:13px;font-weight:700;color:#f1f5f9}
.modal-sub{font-size:10px;color:#64748b;margin-top:2px}
.modal-lbl{font-size:10px;color:#94a3b8;font-weight:600;margin-bottom:5px;display:block}
.modal-input{width:100%;background:#0f172a;border:1px solid #334155;border-radius:7px;padding:7px 10px;font-size:11px;color:#f1f5f9;font-family:inherit}
.modal-input:focus{outline:2px solid #FEE500;outline-offset:1px;border-color:#FEE500}
.modal-hint{font-size:9px;color:#475569;margin-top:6px;line-height:1.5}
.modal-hint strong{color:#64748b}
.modal-actions{display:flex;gap:8px;margin-top:18px;justify-content:flex-end}
.btn-cancel{background:transparent;border:1px solid #334155;color:#64748b;padding:5px 14px;border-radius:6px;font-size:11px;cursor:pointer;font-family:inherit}
.btn-cancel:hover{background:#0f172a}
.btn-save{background:#FEE500;border:none;color:#3A1D1D;font-weight:700;padding:5px 14px;border-radius:6px;font-size:11px;cursor:pointer;font-family:inherit}
.btn-save:hover{opacity:.85}
.btn-open{background:#3A1D1D;border:none;color:#FEE500;font-weight:600;padding:5px 14px;border-radius:6px;font-size:11px;cursor:pointer;font-family:inherit}
.btn-open:hover{opacity:.85}

footer{margin-top:12px;text-align:center;color:#475569;font-size:9px}
</style>
</head>
<body>

<div id="loadingScreen">
  <div class="spinner"></div>
  <p id="loadingMsg">로그인 확인 중...</p>
</div>

<div class="wrap" id="mainContent" style="display:none">
  <nav>
    <div class="nav-left">
      <h1>Review Growth OS</h1>
      <p id="userName">로딩 중...</p>
    </div>
    <div class="nav-right">
      <a href="dashboard.html" class="nav-btn">📊 크루 현황</a>
      <button class="nav-btn logout" onclick="doLogout()">로그아웃</button>
    </div>
  </nav>

  <div class="summary-row">
    <div class="stat-box">
      <p class="lbl">총 요청함</p>
      <p class="val" id="sumReq" style="color:#60a5fa">0건</p>
    </div>
    <div class="stat-box">
      <p class="lbl">총 요청받음</p>
      <p class="val" id="sumRec" style="color:#4ade80">0건</p>
    </div>
    <div class="stat-box">
      <p class="lbl">전체 차이</p>
      <p class="val" id="sumDiff" style="color:#4ade80">±0</p>
    </div>
    <div class="stat-box">
      <p class="lbl">총 지급 예정액</p>
      <p class="val" id="totalAmount">0원</p>
      <p class="saving" id="saving"></p>
    </div>
  </div>

  <div class="stats-wrap">
    <h2 class="sec-title"><span class="accent-bar"></span>날짜별 완료 통계</h2>
    <div class="cards" id="cards"><p class="empty-stat">완료된 작업이 없습니다.</p></div>
  </div>

  <div class="tbl-wrap">
    <div class="tbl-scroll">
      <table>
        <thead>
          <tr>
            <th>번호</th><th>요청함</th><th style="text-align:center">±</th><th>요청받음</th>
            <th>이름 / 카톡</th><th>상태</th><th>작업일자</th><th>증거사진</th>
            <th>작업 링크</th><th>보상금(원)</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
  <footer>모든 항목 Supabase 자동저장 | 증거사진은 세션 중에만 유지 | Review Growth OS v3.1</footer>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-icon">💬</div>
      <div><p class="modal-title" id="modalTitle">카톡 연결</p><p class="modal-sub">카카오톡 오픈채팅 URL</p></div>
    </div>
    <label class="modal-lbl">오픈채팅 URL</label>
    <input class="modal-input" id="modalInput" type="url" placeholder="https://open.kakao.com/o/..."/>
    <p class="modal-hint"><strong>URL 만들기 →</strong> 카카오톡 → 오픈채팅 → ＋ → 1:1 오픈채팅 → 링크 복사</p>
    <div class="modal-actions">
      <button class="btn-cancel" id="modalCancel">취소</button>
      <button class="btn-open" id="modalOpen" style="display:none">카톡 열기 ↗</button>
      <button class="btn-save" id="modalSave">저장</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://ewuimpdposvcoaeqkcrc.supabase.co'
const SUPABASE_KEY = 'sb_publishable_gzZnqWvL_61ZTo9Gs5cajA_-zQeVnoi'
const { createClient } = supabase
const db = createClient(SUPABASE_URL, SUPABASE_KEY)

const TODAY = new Date().toISOString().split('T')[0]
const COUNT = 40
let userId = null
let data   = []
const photos = {}

// ── 기본 데이터 (Supabase 실패 시 폴백) ──────────
function makeDefault() {
  return Array.from({length:COUNT}, (_,i) => ({
    user_id: userId, slot: i+1,
    name: '리뷰어 '+(i+1), kakao_url: '', requested: 0, received: 0,
    status: '대기중', work_date: TODAY, link: '', reward: 0
  }))
}

// ── 초기화 ────────────────────────────────────────
async function init() {
  setLoadingMsg('로그인 확인 중...')

  const { data: { session } } = await db.auth.getSession()
  if (!session) { location.href = 'index.html'; return }

  userId = session.user.id

  // 프로필 이름
  setLoadingMsg('프로필 로딩 중...')
  let profileName = '크루원'
  const { data: profile } = await db.from('profiles').select('name').eq('id', userId).single()
  if (profile) {
    profileName = profile.name
  } else {
    // 프로필 없으면 생성
    const pendingName = localStorage.getItem('pending_name') || '크루원'
    await db.from('profiles').upsert({ id: userId, name: pendingName })
    profileName = pendingName
    localStorage.removeItem('pending_name')
  }
  document.getElementById('userName').textContent = profileName + '님의 관리 페이지'

  // 리뷰어 데이터 로드
  setLoadingMsg('데이터 로딩 중...')
  await loadReviewers()

  // 화면 표시
  document.getElementById('loadingScreen').style.display = 'none'
  document.getElementById('mainContent').style.display   = 'block'
  renderTable()
  renderStats()
}

async function loadReviewers() {
  const { data: rows, error } = await db
    .from('reviewers')
    .select('*')
    .eq('user_id', userId)
    .order('slot')

  if (error) {
    console.error('reviewers 로드 오류:', error)
    data = makeDefault()
    return
  }

  if (!rows || rows.length === 0) {
    // 슬롯이 없으면 생성 후 다시 로드
    await pushSlots(makeDefault())
    const { data: fresh } = await db.from('reviewers').select('*').eq('user_id', userId).order('slot')
    data = fresh && fresh.length > 0 ? fresh : makeDefault()
  } else if (rows.length < COUNT) {
    // 부족한 슬롯 추가
    const existing = new Set(rows.map(r => r.slot))
    const missing = Array.from({length:COUNT},(_,i)=>i+1).filter(s => !existing.has(s))
    const newSlots = missing.map(s => ({
      user_id: userId, slot: s, name: '리뷰어 '+s,
      kakao_url:'', requested:0, received:0,
      status:'대기중', work_date:TODAY, link:'', reward:0
    }))
    await pushSlots(newSlots)
    const { data: fresh } = await db.from('reviewers').select('*').eq('user_id', userId).order('slot')
    data = fresh || rows
  } else {
    data = rows
  }
}

async function pushSlots(slots) {
  const { error } = await db.from('reviewers').upsert(slots, { onConflict: 'user_id,slot' })
  if (error) console.error('슬롯 생성 오류:', error)
}

function setLoadingMsg(msg) {
  document.getElementById('loadingMsg').textContent = msg
}

// ── 저장 (디바운스) ───────────────────────────────
let saveTimers = {}
async function saveRow(r) {
  clearTimeout(saveTimers[r.slot])
  document.getElementById('saving').textContent = '저장 중...'
  saveTimers[r.slot] = setTimeout(async () => {
    const { error } = await db.from('reviewers').upsert({
      user_id: userId, slot: r.slot,
      name: r.name, kakao_url: r.kakao_url,
      requested: r.requested, received: r.received,
      status: r.status, work_date: r.work_date,
      link: r.link, reward: r.reward,
      updated_at: new Date().toISOString()
    }, { onConflict: 'user_id,slot' })
    if (error) console.error('저장 오류:', error)
    document.getElementById('saving').textContent = ''
  }, 700)
}

// ── 통계 ─────────────────────────────────────────
function renderStats() {
  const dateMap = {}
  let total=0, sumReq=0, sumRec=0
  data.forEach(r => {
    total  += r.reward    || 0
    sumReq += r.requested || 0
    sumRec += r.received  || 0
    if (r.status === '완료') dateMap[r.work_date] = (dateMap[r.work_date]||0) + 1
  })
  document.getElementById('totalAmount').textContent = total.toLocaleString() + '원'
  document.getElementById('sumReq').textContent = sumReq + '건'
  document.getElementById('sumRec').textContent = sumRec + '건'
  const diff = sumReq - sumRec
  const el = document.getElementById('sumDiff')
  el.textContent = (diff>0?'+':'') + diff
  el.style.color  = diff>0 ? '#fbbf24' : diff<0 ? '#f87171' : '#4ade80'

  const sorted = Object.entries(dateMap).sort((a,b)=>b[0]>a[0]?1:-1)
  document.getElementById('cards').innerHTML = sorted.length
    ? sorted.map(([d,c])=>`<div class="card"><p class="card-date">${d}</p><p class="card-count">${c}<span class="card-unit">건 완료</span></p></div>`).join('')
    : '<p class="empty-stat">완료된 작업이 없습니다.</p>'
}

// ── 배지 ─────────────────────────────────────────
function updateBadge(tr, r) {
  const diff = (r.requested||0) - (r.received||0)
  tr.classList.remove('over','under')
  if (diff>0) tr.classList.add('over')
  else if (diff<0) tr.classList.add('under')
  const td = tr.querySelector('.badge-td')
  if (!td) return
  let cls, txt
  if      (diff>0) { cls='badge badge-over';  txt='+'+diff }
  else if (diff<0) { cls='badge badge-under'; txt=''+diff  }
  else             { cls='badge badge-even';  txt='±0'     }
  td.innerHTML = `<span class="${cls}">${txt}</span>`
}

// ── 카운터 셀 ─────────────────────────────────────
function buildCounter(r, field, colorClass, tr) {
  const td   = document.createElement('td')
  const wrap = document.createElement('div'); wrap.className='counter-cell'
  const row  = document.createElement('div'); row.className='counter-row'
  const minus = document.createElement('button'); minus.className='cnt-btn'; minus.textContent='−'
  const num   = document.createElement('span');  num.className='cnt-num '+colorClass; num.textContent=r[field]||0
  const plus  = document.createElement('button'); plus.className='cnt-btn'; plus.textContent='+'
  function upd(d){ r[field]=Math.max(0,(r[field]||0)+d); num.textContent=r[field]; updateBadge(tr,r); renderStats(); saveRow(r) }
  minus.addEventListener('click',()=>upd(-1))
  plus.addEventListener('click',()=>upd(+1))
  row.appendChild(minus); row.appendChild(num); row.appendChild(plus)
  wrap.appendChild(row); td.appendChild(wrap)
  return td
}

// ── 카카오 모달 ───────────────────────────────────
let modalTarget = null
function openModal(r, btn) {
  modalTarget = {r, btn}
  document.getElementById('modalTitle').textContent = r.name + ' 카톡'
  document.getElementById('modalInput').value = r.kakao_url||''
  document.getElementById('modalOpen').style.display = r.kakao_url ? 'inline-block' : 'none'
  document.getElementById('modalBg').classList.add('open')
  setTimeout(()=>document.getElementById('modalInput').focus(), 50)
}
function closeModal() { document.getElementById('modalBg').classList.remove('open'); modalTarget=null }
function saveModal() {
  if (!modalTarget) return
  modalTarget.r.kakao_url = document.getElementById('modalInput').value.trim()
  updateKakaoBtn(modalTarget.btn, modalTarget.r)
  saveRow(modalTarget.r)
  closeModal()
}
function updateKakaoBtn(btn, r) {
  btn.className = r.kakao_url ? 'kakao-btn kakao-linked' : 'kakao-btn kakao-empty'
  btn.title     = r.kakao_url ? '카톡 열기 (우클릭: 수정)' : '카카오톡 연결하기'
}
document.getElementById('modalCancel').addEventListener('click', closeModal)
document.getElementById('modalSave').addEventListener('click', saveModal)
document.getElementById('modalOpen').addEventListener('click', ()=>{ if(modalTarget?.r.kakao_url) window.open(modalTarget.r.kakao_url,'_blank') })
document.getElementById('modalInput').addEventListener('keydown', e=>{ if(e.key==='Enter')saveModal(); if(e.key==='Escape')closeModal() })
document.getElementById('modalBg').addEventListener('click', e=>{ if(e.target===document.getElementById('modalBg'))closeModal() })

// ── 행 빌드 ───────────────────────────────────────
function buildRow(r) {
  const tr = document.createElement('tr')
  const diff = (r.requested||0)-(r.received||0)
  if(diff>0) tr.classList.add('over'); else if(diff<0) tr.classList.add('under')

  // 번호
  const tdN=document.createElement('td'); tdN.className='n'
  tdN.textContent=String(r.slot).padStart(2,'0'); tr.appendChild(tdN)

  // 요청함
  tr.appendChild(buildCounter(r,'requested','req',tr))

  // 배지
  const badgeTd=document.createElement('td'); badgeTd.className='badge-td'; badgeTd.style.textAlign='center'
  tr.appendChild(badgeTd); updateBadge(tr,r)

  // 요청받음
  tr.appendChild(buildCounter(r,'received','rec',tr))

  // 이름+카톡
  const tdName=document.createElement('td')
  const nc=document.createElement('div'); nc.className='name-cell'
  const inpName=document.createElement('input')
  inpName.type='text'; inpName.className='inp-name'; inpName.value=r.name||''
  inpName.addEventListener('input',()=>{ r.name=inpName.value; saveRow(r) })
  const kb=document.createElement('button'); kb.textContent='💬'; updateKakaoBtn(kb,r)
  kb.addEventListener('click',()=>{ r.kakao_url?window.open(r.kakao_url,'_blank'):openModal(r,kb) })
  kb.addEventListener('contextmenu',e=>{ e.preventDefault(); openModal(r,kb) })
  nc.appendChild(inpName); nc.appendChild(kb); tdName.appendChild(nc); tr.appendChild(tdName)

  // 상태
  const tdSt=document.createElement('td')
  const sel=document.createElement('select')
  sel.className='sel-status '+(r.status==='완료'?'done':'wait')
  ['대기중','완료'].forEach(v=>{
    const o=document.createElement('option'); o.value=v
    o.textContent=v==='완료'?'✅ 완료':'⏳ 대기중'
    if(v===r.status) o.selected=true; sel.appendChild(o)
  })
  sel.addEventListener('change',()=>{ r.status=sel.value; sel.className='sel-status '+(r.status==='완료'?'done':'wait'); renderStats(); saveRow(r) })
  tdSt.appendChild(sel); tr.appendChild(tdSt)

  // 날짜
  const tdDate=document.createElement('td')
  const inpDate=document.createElement('input')
  inpDate.type='date'; inpDate.className='inp-date'; inpDate.value=r.work_date||TODAY
  inpDate.addEventListener('change',()=>{ r.work_date=inpDate.value; renderStats(); saveRow(r) })
  tdDate.appendChild(inpDate); tr.appendChild(tdDate)

  // 사진
  const tdP=document.createElement('td')
  const pc=document.createElement('div'); pc.className='photo-cell'
  const tw=document.createElement('span')
  const ut=()=>{ tw.innerHTML=photos[r.slot]?`<img class="thumb" src="${photos[r.slot]}" alt="증거"/>`:`<div class="no-thumb">No</div>` }; ut()
  const uid='fi_'+r.slot
  const lbl=document.createElement('label'); lbl.className='file-label'; lbl.htmlFor=uid; lbl.textContent='📎 사진'
  const fi=document.createElement('input'); fi.type='file'; fi.accept='image/*'; fi.className='file-input'; fi.id=uid
  fi.addEventListener('change',()=>{
    const f=fi.files[0]; if(!f) return
    const fr=new FileReader(); fr.onload=ev=>{
      photos[r.slot]=ev.target.result; ut()
      r.status='완료'; sel.value='완료'; sel.className='sel-status done'
      renderStats(); saveRow(r)
    }; fr.readAsDataURL(f)
  })
  pc.appendChild(tw); pc.appendChild(lbl); pc.appendChild(fi); tdP.appendChild(pc); tr.appendChild(tdP)

  // URL
  const tdU=document.createElement('td'); tdU.style.minWidth='160px'
  const inpU=document.createElement('input'); inpU.type='url'; inpU.className='inp-url'
  inpU.placeholder='링크 입력'; inpU.value=r.link||''
  inpU.addEventListener('input',()=>{ r.link=inpU.value; saveRow(r) })
  tdU.appendChild(inpU); tr.appendChild(tdU)

  // 보상금
  const tdR=document.createElement('td')
  const inpR=document.createElement('input'); inpR.type='number'; inpR.className='inp-num'; inpR.value=r.reward||0
  inpR.addEventListener('input',()=>{ r.reward=parseInt(inpR.value)||0; renderStats(); saveRow(r) })
  tdR.appendChild(inpR); tr.appendChild(tdR)

  return tr
}

function renderTable() {
  const tbody=document.getElementById('tbody'); tbody.innerHTML=''
  data.forEach(r=>tbody.appendChild(buildRow(r)))
}

async function doLogout() {
  await db.auth.signOut()
  location.href='index.html'
}

init()
</script>
</body>
</html>
