<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>보거스 1기 CREW</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Black+Han+Sans&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0f1e;color:#f1f5f9;font-family:'Noto Sans KR',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg span{position:absolute;border-radius:50%;opacity:.12;animation:float 8s ease-in-out infinite}
.bg span:nth-child(1){width:300px;height:300px;background:#deff9a;top:-80px;left:-80px}
.bg span:nth-child(2){width:200px;height:200px;background:#60a5fa;bottom:10%;right:-60px;animation-delay:2s}
.bg span:nth-child(3){width:150px;height:150px;background:#a78bfa;top:40%;left:5%;animation-delay:4s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
.page{position:relative;z-index:1;width:100%;max-width:460px;padding:32px 20px 48px;display:flex;flex-direction:column;align-items:center;gap:24px}
.hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.illustration{width:240px;height:185px;filter:drop-shadow(0 0 24px rgba(222,255,154,.3))}
.crew-badge{display:inline-block;background:rgba(222,255,154,.1);border:1px solid rgba(222,255,154,.3);color:#deff9a;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;padding:5px 16px;border-radius:99px}
.hero-title{font-family:'Black Han Sans',sans-serif;font-size:40px;line-height:1.1;color:#fff}
.hero-title span{color:#deff9a}
.hero-sub{font-size:14px;color:#64748b;line-height:1.6}
.dash-btn{display:flex;align-items:center;gap:10px;background:rgba(96,165,250,.1);border:1px solid rgba(96,165,250,.3);color:#60a5fa;padding:12px 24px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;transition:all .2s;width:100%;justify-content:center}
.dash-btn:hover{background:rgba(96,165,250,.2);transform:translateY(-2px)}
.auth-card{background:rgba(30,41,59,.85);border:1px solid #334155;border-radius:20px;padding:28px 24px;width:100%;backdrop-filter:blur(12px)}
.tab-row{display:flex;gap:4px;background:#0f172a;border-radius:10px;padding:4px;margin-bottom:24px}
.tab-btn{flex:1;padding:11px;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit;color:#64748b;background:transparent}
.tab-btn.active{background:#1e293b;color:#deff9a;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.form-group{margin-bottom:18px}
.form-label{display:block;font-size:14px;color:#94a3b8;margin-bottom:7px;font-weight:600}
.form-input{width:100%;background:#0f172a;border:1px solid #334155;border-radius:10px;padding:15px 16px;font-size:17px;color:#f1f5f9;font-family:inherit;transition:border-color .2s}
.form-input:focus{outline:none;border-color:#deff9a}
.form-input::placeholder{color:#475569}
.submit-btn{width:100%;background:#deff9a;border:none;border-radius:12px;padding:17px;font-size:18px;font-weight:700;color:#0a0f1e;cursor:pointer;font-family:inherit;transition:all .2s;margin-top:6px}
.submit-btn:hover{opacity:.9;transform:translateY(-1px)}
.submit-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.msg{font-size:13px;margin-top:12px;text-align:center;padding:9px 12px;border-radius:8px;min-height:20px}
.msg.err{color:#f87171;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.2)}
.msg.ok{color:#4ade80;background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.2)}
.msg:empty{padding:0}
.form-pane{display:none}.form-pane.active{display:block}
.logged-in{text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}
.logged-in p{color:#94a3b8;font-size:16px}
.go-manage{background:#deff9a;color:#0a0f1e;border:none;border-radius:12px;padding:17px 32px;font-size:18px;font-weight:700;cursor:pointer;font-family:inherit;width:100%;transition:opacity .2s}
.go-manage:hover{opacity:.9}
.logout-link{color:#64748b;font-size:13px;cursor:pointer;background:none;border:none;font-family:inherit;text-decoration:underline}
.hint{font-size:12px;color:#475569;line-height:1.6;text-align:center}
</style>
</head>
<body>
<div class="bg"><span></span><span></span><span></span></div>
<div class="page">
  <div class="hero">
    <svg class="illustration" viewBox="0 0 240 185" fill="none">
      <line x1="120" y1="92" x2="55" y2="50" stroke="#deff9a" stroke-width="1" stroke-opacity=".3" stroke-dasharray="4,4"/>
      <line x1="120" y1="92" x2="185" y2="50" stroke="#deff9a" stroke-width="1" stroke-opacity=".3" stroke-dasharray="4,4"/>
      <line x1="120" y1="92" x2="30" y2="130" stroke="#60a5fa" stroke-width="1" stroke-opacity=".3" stroke-dasharray="4,4"/>
      <line x1="120" y1="92" x2="210" y2="130" stroke="#60a5fa" stroke-width="1" stroke-opacity=".3" stroke-dasharray="4,4"/>
      <line x1="120" y1="92" x2="120" y2="158" stroke="#a78bfa" stroke-width="1" stroke-opacity=".3" stroke-dasharray="4,4"/>
      <circle cx="120" cy="92" r="22" fill="#deff9a" fill-opacity=".12" stroke="#deff9a" stroke-width="1.5"/>
      <text x="120" y="98" text-anchor="middle" fill="#deff9a" font-size="17" font-weight="bold">C</text>
      <circle cx="55" cy="36" r="15" fill="#1e293b" stroke="#deff9a" stroke-width="1.5"/>
      <circle cx="55" cy="30" r="5.5" fill="#deff9a" fill-opacity=".8"/>
      <path d="M43 51 Q55 42 67 51" stroke="#deff9a" stroke-width="1.5" fill="none"/>
      <circle cx="185" cy="36" r="15" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
      <circle cx="185" cy="30" r="5.5" fill="#60a5fa" fill-opacity=".8"/>
      <path d="M173 51 Q185 42 197 51" stroke="#60a5fa" stroke-width="1.5" fill="none"/>
      <circle cx="22" cy="122" r="15" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
      <circle cx="22" cy="116" r="5.5" fill="#a78bfa" fill-opacity=".8"/>
      <path d="M10 137 Q22 128 34 137" stroke="#a78bfa" stroke-width="1.5" fill="none"/>
      <circle cx="218" cy="122" r="15" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
      <circle cx="218" cy="116" r="5.5" fill="#4ade80" fill-opacity=".8"/>
      <path d="M206 137 Q218 128 230 137" stroke="#4ade80" stroke-width="1.5" fill="none"/>
      <circle cx="120" cy="165" r="15" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
      <circle cx="120" cy="159" r="5.5" fill="#fbbf24" fill-opacity=".8"/>
      <path d="M108 180 Q120 171 132 180" stroke="#fbbf24" stroke-width="1.5" fill="none"/>
    </svg>
    <p class="crew-badge">보거스 공식 크루</p>
    <h1 class="hero-title">보거스<br/><span>1기 CREW</span></h1>
    <p class="hero-sub">상생을 위한 리뷰 크루<br/>함께 성장하는 우리의 이야기</p>
  </div>

  <a href="dashboard.html" class="dash-btn">📊 크루 전체 활동 현황 보기</a>

  <div class="auth-card">
    <div class="logged-in" id="loggedInView" style="display:none">
      <p id="loggedInName">안녕하세요!</p>
      <button class="go-manage" onclick="location.href='manage.html'">🗂️ 내 관리 페이지 열기</button>
      <button class="logout-link" onclick="doLogout()">로그아웃</button>
    </div>
    <div id="authView">
      <div class="tab-row">
        <button class="tab-btn active" id="tabSignup" onclick="switchTab('signup')">✨ 크루 가입</button>
        <button class="tab-btn" id="tabLogin" onclick="switchTab('login')">🔑 로그인</button>
      </div>
      <div class="form-pane active" id="signupPane">
        <div class="form-group">
          <label class="form-label">이름 (활동명)</label>
          <input class="form-input" id="signupName" type="text" placeholder="홍길동" autocomplete="off"/>
        </div>
        <div class="form-group">
          <label class="form-label">비밀번호 (6자리 이상)</label>
          <input class="form-input" id="signupPw" type="password" placeholder="••••••"/>
        </div>
        <button class="submit-btn" id="signupBtn" onclick="doSignup()">크루 가입하기 →</button>
        <div class="msg" id="signupMsg"></div>
      </div>
      <div class="form-pane" id="loginPane">
        <div class="form-group">
          <label class="form-label">이름</label>
          <input class="form-input" id="loginName" type="text" placeholder="홍길동" autocomplete="off"/>
        </div>
        <div class="form-group">
          <label class="form-label">비밀번호</label>
          <input class="form-input" id="loginPw" type="password" placeholder="••••••"/>
        </div>
        <button class="submit-btn" id="loginBtn" onclick="doLogin()">로그인 →</button>
        <div class="msg" id="loginMsg"></div>
      </div>
    </div>
  </div>
  <p class="hint">이름과 비밀번호만 기억하면 어디서든 로그인할 수 있어요</p>
</div>

<script>
const SURL='https://ewuimpdposvcoaeqkcrc.supabase.co'
const SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV3dWltcGRwb3N2Y29hZXFrY3JjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4NjU1NzUsImV4cCI6MjA5MzQ0MTU3NX0.EF9WqvNY2D_l6yKYh-BR7FQVwj-12Z4D94sIupmaS4k'
const db=supabase.createClient(SURL,SKEY)

const nameToEmail=n=>btoa(unescape(encodeURIComponent(n.trim()))).replace(/[^a-zA-Z0-9]/g,'').toLowerCase()+'@bogus-crew.com'

function switchTab(t){
  document.getElementById('tabSignup').classList.toggle('active',t==='signup')
  document.getElementById('tabLogin').classList.toggle('active',t==='login')
  document.getElementById('signupPane').classList.toggle('active',t==='signup')
  document.getElementById('loginPane').classList.toggle('active',t==='login')
  document.getElementById('signupMsg').className='msg'
  document.getElementById('signupMsg').textContent=''
  document.getElementById('loginMsg').className='msg'
  document.getElementById('loginMsg').textContent=''
}

async function checkSession(){
  const {data:{session}}=await db.auth.getSession()
  if(session) showLoggedIn(session.user)
}

async function showLoggedIn(user){
  document.getElementById('authView').style.display='none'
  document.getElementById('loggedInView').style.display='flex'
  const {data}=await db.from('profiles').select('name').eq('id',user.id).single()
  const name=data?.name||'크루원'
  document.getElementById('loggedInName').textContent=name+'님, 반갑습니다! 👋'
}

async function doSignup(){
  const name=document.getElementById('signupName').value.trim()
  const pw=document.getElementById('signupPw').value
  const msg=document.getElementById('signupMsg')
  const btn=document.getElementById('signupBtn')
  if(!name){setMsg(msg,'err','이름을 입력해 주세요.');return}
  if(pw.length<6){setMsg(msg,'err','비밀번호는 6자리 이상이어야 해요.');return}
  btn.disabled=true;btn.textContent='가입 중...'
  const {data,error}=await db.auth.signUp({email:nameToEmail(name),password:pw})
  if(error){setMsg(msg,'err',xlateErr(error.message));btn.disabled=false;btn.textContent='크루 가입하기 →';return}
  if(data.session){
    setMsg(msg,'ok','가입 완료!')
    // 프로필 저장 (비밀번호 힌트 포함)
    await db.from('profiles').upsert({id:data.session.user.id,name,password_hint:pw})
    localStorage.setItem('pw_'+data.session.user.id,pw)
    // 40개 슬롯 생성
    const slots=Array.from({length:40},(_,i)=>({user_id:data.session.user.id,slot:i+1,name:'리뷰어'+(i+1),kakao_url:'',requested:0,received:0,status:'대기중',work_date:new Date().toISOString().split('T')[0],link:'',reward:0,note:'',account:'',address:''}))
    await db.from('reviewers').upsert(slots,{onConflict:'user_id,slot'})
    location.href='manage.html'
  } else {
    setMsg(msg,'err','Supabase에서 이메일 확인을 OFF 해주세요.')
    btn.disabled=false;btn.textContent='크루 가입하기 →'
  }
}

async function doLogin(){
  const name=document.getElementById('loginName').value.trim()
  const pw=document.getElementById('loginPw').value
  const msg=document.getElementById('loginMsg')
  const btn=document.getElementById('loginBtn')
  if(!name||!pw){setMsg(msg,'err','이름과 비밀번호를 입력해 주세요.');return}
  btn.disabled=true;btn.textContent='로그인 중...'
  const {data,error}=await db.auth.signInWithPassword({email:nameToEmail(name),password:pw})
  if(error){setMsg(msg,'err',xlateErr(error.message));btn.disabled=false;btn.textContent='로그인 →';return}
  // 로그인 성공 시 비밀번호 로컬 저장 + DB 업데이트
  localStorage.setItem('pw_'+data.session.user.id,pw)
  await db.from('profiles').update({password_hint:pw}).eq('id',data.session.user.id)
  location.href='manage.html'
}

async function doLogout(){await db.auth.signOut();location.reload()}

function setMsg(el,type,text){el.className='msg '+type;el.textContent=text}
function xlateErr(m){
  if(m.includes('already registered'))return '이미 가입된 이름이에요. 로그인해 주세요.'
  if(m.includes('Invalid login')||m.includes('invalid_credentials'))return '이름 또는 비밀번호가 틀렸어요.'
  return '오류: '+m
}

document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return
  document.getElementById('signupPane').classList.contains('active')?doSignup():doLogin()
})
checkSession()
</script>
</body>
</html>
